name: observadoras
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-observadoras}
      POSTGRES_DB: ${POSTGRES_DB:-observadoras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    image: observadoras-app:local
    pull_policy: never
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    env_file: .env
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    image: observadoras-app:local
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  ai-worker:
    image: observadoras-app:local
    pull_policy: never
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    env_file: .env
    command: ["node", "--import", "tsx", "scripts/ai-worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 35s
volumes:
  production_data:
